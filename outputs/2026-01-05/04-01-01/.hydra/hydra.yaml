hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - algorithm.adv_estimator=grpo
    - data.train_batch_size=32
    - data.max_prompt_length=16384
    - data.max_response_length=20000
    - data.return_raw_chat=True
    - data.return_multi_modal_inputs=True
    - data.filter_overlong_prompts=True
    - data.filter_overlong_prompts_workers=128
    - data.truncation=left
    - data.image_key=images
    - data.video_key=videos
    - custom_reward_function.path=pkg://a2agent.reward.reward_a2po
    - custom_reward_function.name=compute_score
    - actor_rollout_ref.rollout.multi_turn.enable=True
    - actor_rollout_ref.rollout.multi_turn.format=multimodalcode
    - actor_rollout_ref.rollout.agent.default_agent_loop=tool_agent
    - actor_rollout_ref.rollout.multi_turn.max_user_turns=5
    - actor_rollout_ref.rollout.multi_turn.max_assistant_turns=5
    - actor_rollout_ref.rollout.multi_turn.max_parallel_calls=8
    - actor_rollout_ref.rollout.multi_turn.max_tool_response_length=1024
    - actor_rollout_ref.rollout.multi_turn.tool_config_path=/project/peilab/qjl/A2AGENT/a2agent/tools/config/a2agent_tool_config.yaml
    - actor_rollout_ref.model.path=/project/peilab/qjl/A2AGENT/a2agent/model/Qwen3-VL-4B-Instruct
    - actor_rollout_ref.actor.optim.lr=1e-6
    - actor_rollout_ref.model.use_remove_padding=True
    - actor_rollout_ref.actor.ppo_mini_batch_size=8
    - actor_rollout_ref.actor.ppo_micro_batch_size_per_gpu=1
    - actor_rollout_ref.actor.use_kl_loss=False
    - actor_rollout_ref.actor.entropy_coeff=0
    - actor_rollout_ref.model.enable_gradient_checkpointing=True
    - actor_rollout_ref.actor.fsdp_config.param_offload=False
    - actor_rollout_ref.actor.fsdp_config.optimizer_offload=False
    - actor_rollout_ref.rollout.log_prob_micro_batch_size_per_gpu=1
    - actor_rollout_ref.rollout.tensor_model_parallel_size=1
    - actor_rollout_ref.rollout.name=sglang
    - actor_rollout_ref.rollout.gpu_memory_utilization=0.5
    - actor_rollout_ref.rollout.n=16
    - actor_rollout_ref.ref.log_prob_micro_batch_size_per_gpu=1
    - actor_rollout_ref.ref.fsdp_config.param_offload=False
    - algorithm.use_kl_in_reward=False
    - trainer.critic_warmup=0
    - trainer.logger=["console","wandb"]
    - trainer.project_name=a2agent_async_rl
    - trainer.experiment_name=qwen3_4b_a2agent_test0
    - trainer.n_gpus_per_node=8
    - trainer.nnodes=1
    - trainer.save_freq=20
    - trainer.test_freq=20
    - data.train_files=/project/peilab/qjl/A2AGENT/a2agent/data/a2agent_rl/train.parquet
    - data.val_files=/project/peilab/qjl/A2AGENT/a2agent/data/a2agent_rl/test.parquet
    - trainer.total_epochs=3
  job:
    name: main_ppo
    chdir: null
    override_dirname: actor_rollout_ref.actor.entropy_coeff=0,actor_rollout_ref.actor.fsdp_config.optimizer_offload=False,actor_rollout_ref.actor.fsdp_config.param_offload=False,actor_rollout_ref.actor.optim.lr=1e-6,actor_rollout_ref.actor.ppo_micro_batch_size_per_gpu=1,actor_rollout_ref.actor.ppo_mini_batch_size=8,actor_rollout_ref.actor.use_kl_loss=False,actor_rollout_ref.model.enable_gradient_checkpointing=True,actor_rollout_ref.model.path=/project/peilab/qjl/A2AGENT/a2agent/model/Qwen3-VL-4B-Instruct,actor_rollout_ref.model.use_remove_padding=True,actor_rollout_ref.ref.fsdp_config.param_offload=False,actor_rollout_ref.ref.log_prob_micro_batch_size_per_gpu=1,actor_rollout_ref.rollout.agent.default_agent_loop=tool_agent,actor_rollout_ref.rollout.gpu_memory_utilization=0.5,actor_rollout_ref.rollout.log_prob_micro_batch_size_per_gpu=1,actor_rollout_ref.rollout.multi_turn.enable=True,actor_rollout_ref.rollout.multi_turn.format=multimodalcode,actor_rollout_ref.rollout.multi_turn.max_assistant_turns=5,actor_rollout_ref.rollout.multi_turn.max_parallel_calls=8,actor_rollout_ref.rollout.multi_turn.max_tool_response_length=1024,actor_rollout_ref.rollout.multi_turn.max_user_turns=5,actor_rollout_ref.rollout.multi_turn.tool_config_path=/project/peilab/qjl/A2AGENT/a2agent/tools/config/a2agent_tool_config.yaml,actor_rollout_ref.rollout.n=16,actor_rollout_ref.rollout.name=sglang,actor_rollout_ref.rollout.tensor_model_parallel_size=1,algorithm.adv_estimator=grpo,algorithm.use_kl_in_reward=False,custom_reward_function.name=compute_score,custom_reward_function.path=pkg://a2agent.reward.reward_a2po,data.filter_overlong_prompts=True,data.filter_overlong_prompts_workers=128,data.image_key=images,data.max_prompt_length=16384,data.max_response_length=20000,data.return_multi_modal_inputs=True,data.return_raw_chat=True,data.train_batch_size=32,data.train_files=/project/peilab/qjl/A2AGENT/a2agent/data/a2agent_rl/train.parquet,data.truncation=left,data.val_files=/project/peilab/qjl/A2AGENT/a2agent/data/a2agent_rl/test.parquet,data.video_key=videos,trainer.critic_warmup=0,trainer.experiment_name=qwen3_4b_a2agent_test0,trainer.logger=["console","wandb"],trainer.n_gpus_per_node=8,trainer.nnodes=1,trainer.project_name=a2agent_async_rl,trainer.save_freq=20,trainer.test_freq=20,trainer.total_epochs=3
    id: ???
    num: ???
    config_name: ppo_trainer
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /project/peilab/qjl/A2AGENT
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /project/peilab/qjl/A2AGENT/verl/trainer/config
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /project/peilab/qjl/A2AGENT/outputs/2026-01-05/04-01-01
    choices:
      algorithm@algorithm.rollout_correction: rollout_correction
      reward_model: dp_reward_loop
      critic: dp_critic
      critic/../engine@critic.model.fsdp_config: fsdp
      critic/../optim@critic.optim: fsdp
      model@actor_rollout_ref.model: hf_model
      rollout@actor_rollout_ref.rollout: rollout
      ref@actor_rollout_ref.ref: dp_ref
      ref/../engine@actor_rollout_ref.ref.fsdp_config: fsdp
      data: legacy_data
      actor@actor_rollout_ref.actor: dp_actor
      actor/../engine@actor_rollout_ref.actor.fsdp_config: fsdp
      actor/../optim@actor_rollout_ref.actor.optim: fsdp
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
