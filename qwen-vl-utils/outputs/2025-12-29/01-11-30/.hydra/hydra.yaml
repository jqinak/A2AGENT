      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /project/peilab/qjl/CODE/Qwen3-VL/qwen-vl-utils/outputs/2025-12-29/01-11-30
    choices:
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
