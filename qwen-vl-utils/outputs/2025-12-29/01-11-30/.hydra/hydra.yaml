    - trainer.default_local_dir=/project/peilab/qjl/CODE/verl/save_checkpoints/deepeyesv2/deepeyesv2
    - +trainer.tensorboard_dir=/project/peilab/qjl/CODE/verl/save_checkpoints/logs/tensorboard
    - +trainer.rl_logging_board_dir=/project/peilab/qjl/CODE/verl/save_checkpoints/logs/rl_logging_board
    - trainer.total_epochs=32
